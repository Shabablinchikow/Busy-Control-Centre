name: Release

# Tag a version to publish: git tag v1.0.1 && git push origin v1.0.1
# Signing and notarisation are optional. Without the secrets below CI still
# builds and attaches an unsigned zip, which needs a right-click → Open on the
# downloader's Mac. With them the release is signed, notarised and stapled:
#   MACOS_CERTIFICATE        base64 of a Developer ID Application .p12
#   MACOS_CERTIFICATE_PWD    password for that .p12
#   MACOS_SIGNING_IDENTITY   e.g. "Developer ID Application: Name (TEAMID)"
#   MACOS_DEVELOPMENT_TEAM   the 10-character team id
#   NOTARY_APPLE_ID          Apple ID used for notarisation
#   NOTARY_PASSWORD          app-specific password for that Apple ID

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    # Secrets are lifted to job level because the `secrets` context is not
    # available in a step's `if`, while job-level `env` is.
    env:
      TEAM: ${{ secrets.MACOS_DEVELOPMENT_TEAM }}
      CERT: ${{ secrets.MACOS_CERTIFICATE }}
      CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
      APP: build/Build/Products/Release/Busy Control Centre.app

    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Set team id
        if: env.TEAM != ''
        run: |
          /usr/bin/sed -i '' "s/DEVELOPMENT_TEAM: .*/DEVELOPMENT_TEAM: $TEAM/" project.yml

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -project BusyBar.xcodeproj -scheme BusyBar \
            -configuration Release -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build

      - name: Import signing certificate
        if: env.CERT != ''
        run: |
          echo "$CERT" | base64 --decode > /tmp/cert.p12
          security create-keychain -p runner build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p runner build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k runner build.keychain
          rm -f /tmp/cert.p12

      - name: Sign
        if: env.IDENTITY != ''
        run: |
          codesign --force --deep --options runtime --timestamp \
            --entitlements BusyBar.entitlements --sign "$IDENTITY" "$APP"
          codesign --verify --strict "$APP"

      - name: Package
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Contents/Info.plist")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ditto -c -k --keepParent "$APP" "Busy-Control-Centre-$VERSION.zip"

      - name: Notarise and staple
        if: env.NOTARY_APPLE_ID != ''
        run: |
          xcrun notarytool submit "Busy-Control-Centre-$VERSION.zip" \
            --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" \
            --team-id "$TEAM" --wait
          xcrun stapler staple "$APP"
          rm -f "Busy-Control-Centre-$VERSION.zip"
          ditto -c -k --keepParent "$APP" "Busy-Control-Centre-$VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Busy-Control-Centre
          path: Busy-Control-Centre-*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Busy-Control-Centre-*.zip
          generate_release_notes: true
