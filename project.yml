name: BusyBar
options:
  bundleIdPrefix: ru.shbbl
  deploymentTarget:
    macOS: "14.0"
targets:
  BusyBar:
    type: application
    platform: macOS
    sources:
      - Sources
      # Banner artwork is not in the repo (see README); the picker falls back to
      # text labels, so the folder is allowed to be absent.
      - path: Resources/Themes
        type: folder
        optional: true
    entitlements:
      path: BusyBar.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # NWListener in the Bonjour permission trigger needs server
        com.apple.security.network.server: true
        com.apple.security.personal-information.location: true
        # Claude Limits: user picks ~/.claude via NSOpenPanel (bookmark-based)
        com.apple.security.files.user-selected.read-only: true
        # Mail widget: AppleScript to Apple Mail for the unread count.
        com.apple.security.automation.apple-events: true
        # ...and this one is not optional despite the name. With only the
        # entitlement above, appleeventsd logs "attempted to lookup
        # App:.../com.apple.mail ... but was denied due to sandboxing" and the
        # script fails with -600 "Application isn't running" while Mail is
        # plainly running. The sandbox blocks the target *lookup*, so the target
        # has to be named here. scripting-targets is no use: it only covers apps
        # that publish an sdef access group, which Mail does not.
        com.apple.security.temporary-exception.apple-events:
          - com.apple.mail
    info:
      path: Info.plist
      properties:
        CFBundleIconFile: AppIcon
        CFBundleDisplayName: Busy Control Centre
        CFBundleShortVersionString: 1.3.2
        CFBundleVersion: "11"
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: BusyBar talks to the BUSY Bar device over USB or Wi-Fi on your local network.
        NSBonjourServices: [_busybar._tcp]
        NSLocationWhenInUseUsageDescription: Fills in your coordinates for the ISS and Weather widgets.
        NSAppleEventsUsageDescription: BusyBar asks Apple Mail how many unread messages are in your inbox, to show the count on the bar.
        NSHumanReadableCopyright: © 2026 Aleksei Shabalin
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.shbbl.BusyBar
        PRODUCT_NAME: Busy Control Centre
        MARKETING_VERSION: 1.3.2
        CURRENT_PROJECT_VERSION: 11
        DEVELOPMENT_TEAM: 72WR88WUFR
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        # required for notarisation; release signing also passes --options runtime
        ENABLE_HARDENED_RUNTIME: YES
